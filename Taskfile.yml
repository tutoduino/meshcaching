# Usage:
#   task build                     -> build every board
#   task build TARGET=heltec_v3    -> build a single board
#   task upload TARGET=heltec_v3   -> upload (default: wio_tracker_l1)
#   task flash TARGET=...          -> upload, then open the serial monitor
# Targets: wio_tracker_l1, heltec_v3, heltec_v4_2, heltec_v4_3, heltec_v4_r8,
# heltec_t096, tbeam_supreme, tdeck.
# Serial port auto-detected by PlatformIO; force it with PORT=/dev/ttyACM0.
# If the upload fails on the Wio Tracker: double-press RESET = bootloader
# mode (DFU port), then try again.
version: '3'

tasks:
  default:
    silent: true
    cmds:
      - task --list

  build:
    desc: Build the firmware (every board, or TARGET=...)
    cmds:
      - pio run {{if .TARGET}}-e {{.TARGET}}{{end}}

  upload:
    desc: Build and upload (TARGET=wio_tracker_l1 by default)
    vars:
      TARGET: '{{.TARGET | default "wio_tracker_l1"}}'
    cmds:
      - pio run -e {{.TARGET}} --target upload {{if .PORT}}--upload-port {{.PORT}}{{end}}

  monitor:
    desc: Serial monitor (115200 baud, Ctrl-C to quit)
    interactive: true
    cmds:
      - pio device monitor {{if .PORT}}--port {{.PORT}}{{end}}

  flash:
    desc: Upload, then open the serial monitor
    cmds:
      - task: upload
        vars: { TARGET: '{{.TARGET}}', PORT: '{{.PORT}}' }
      - task: monitor
        vars: { PORT: '{{.PORT}}' }

  ports:
    desc: List the detected serial ports
    cmds:
      - pio device list

  clean:
    desc: Remove the build artifacts
    cmds:
      - pio run --target clean

# Usage :
#   task build                     -> compile toutes les cartes
#   task build TARGET=heltec_v3    -> compile une seule carte
#   task upload TARGET=heltec_v3   -> téléverse (défaut : wio_tracker_l1)
#   task flash TARGET=...          -> téléverse puis ouvre le moniteur série
# Cibles : wio_tracker_l1, heltec_v3, heltec_v4_3, heltec_v4_r8.
# Port série auto-détecté par PlatformIO ; forcer avec PORT=/dev/ttyACM0.
# Si l'upload échoue sur le Wio Tracker : double-appui sur RESET = mode
# bootloader (port DFU), puis relancer.
version: '3'

tasks:
  default:
    silent: true
    cmds:
      - task --list

  build:
    desc: Compile le firmware (toutes les cartes, ou TARGET=...)
    cmds:
      - pio run {{if .TARGET}}-e {{.TARGET}}{{end}}

  upload:
    desc: Compile et téléverse (TARGET=wio_tracker_l1 par défaut)
    vars:
      TARGET: '{{.TARGET | default "wio_tracker_l1"}}'
    cmds:
      - pio run -e {{.TARGET}} --target upload {{if .PORT}}--upload-port {{.PORT}}{{end}}

  monitor:
    desc: Moniteur série (115200 bauds, Ctrl-C pour quitter)
    interactive: true
    cmds:
      - pio device monitor {{if .PORT}}--port {{.PORT}}{{end}}

  flash:
    desc: Téléverse puis ouvre le moniteur série
    cmds:
      - task: upload
        vars: { TARGET: '{{.TARGET}}', PORT: '{{.PORT}}' }
      - task: monitor
        vars: { PORT: '{{.PORT}}' }

  ports:
    desc: Liste les ports série détectés
    cmds:
      - pio device list

  clean:
    desc: Supprime les artefacts de build
    cmds:
      - pio run --target clean

# Release: on every semver tag (vX.Y.Z), build all targets and publish
# the ready-to-flash binaries (see scripts/package.sh).
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe needs the tag history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO and esptool
        # Pinned versions: re-running an old tag must rebuild with the
        # same toolchain as the original release.
        run: pip install platformio==6.1.19 esptool==5.2.0

      - name: Build all targets
        run: pio run

      - name: Package binaries
        run: scripts/package.sh "$GITHUB_REF_NAME" dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ## Flasher le firmware

            ### Le plus simple : le flasher web MeshCore

            1. Ouvrir [flasher.meshcore.io](https://flasher.meshcore.io) ;
            2. choisir **« Custom Firmware »**, tout en bas de la liste des modèles de cartes ;
            3. sélectionner le fichier correspondant à votre carte ci-dessous, et flasher.

            | Carte | Fichier |
            |---|---|
            | Seeed Wio Tracker L1 Pro | `meshcaching-wio_tracker_l1-${{ github.ref_name }}.zip` |
            | Heltec WiFi LoRa 32 V3 | `meshcaching-heltec_v3-${{ github.ref_name }}-merged.bin` |
            | Heltec WiFi LoRa 32 V4.3 | `meshcaching-heltec_v4_3-${{ github.ref_name }}-merged.bin` |
            | Heltec WiFi LoRa 32 V4 R8 | `meshcaching-heltec_v4_r8-${{ github.ref_name }}-merged.bin` |
            | Heltec T096 | `meshcaching-heltec_t096-${{ github.ref_name }}.zip` |

            Sur les Heltec, l'image est complète et efface tout l'appareil (le suffixe `-merged.bin` indique au flasher de l'écrire à l'adresse 0).

            ### Alternatives en ligne de commande

            - **Cartes nRF52 (Wio Tracker L1, T096)** : double appui sur RESET (un disque USB apparaît), puis glisser-déposer le fichier `.uf2` de la carte dessus. Ou en DFU série : `adafruit-nrfutil dfu serial --package <fichier>.zip -p <port> -b 115200 --singlebank --touch 1200`
            - **Heltec (ESP32)** : `esptool --chip esp32s3 write_flash 0x0 meshcaching-<carte>-${{ github.ref_name }}-merged.bin`

# Release: on every semver tag (vX.Y.Z), build every target and publish
# the ready-to-flash binaries (see scripts/package.sh).
# A tag with a suffix (vX.Y.Z-rc1, vX.Y.Z-tbeam.2...) is published as a
# pre-release: same binaries, downloadable without a GitHub account, but
# not shown as the latest stable version.
#
# The targets are built in parallel, one job per [env:...] section of
# platformio.ini (the list is read from the file, nothing to maintain
# here). A manual run (workflow_dispatch) builds and packages everything
# as workflow artifacts without publishing a release: use it to test the
# build on a branch.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - uses: actions/checkout@v4

      - name: List the PlatformIO environments
        id: list
        run: |
          envs=$(grep -oP '^\[env:\K[^\]]+' platformio.ini \
                 | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "envs=$envs" >> "$GITHUB_OUTPUT"
          echo "targets: $envs"

  build:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.targets.outputs.envs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe needs the tag history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.env }}-

      - name: Install PlatformIO and esptool
        # Pinned versions: re-running an old tag must rebuild with the
        # same toolchain as the original release.
        run: pip install platformio==6.1.19 esptool==5.2.0

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Package binaries
        # Version = the tag on a release, git describe on a manual run
        # (same value scripts/version.py bakes into the firmware).
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            version=$(git describe --tags --always)
          fi
          scripts/package.sh "$version" dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.env }}
          path: dist/meshcaching-*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: cd dist && sha256sum meshcaching-* > SHA256SUMS && ls -l

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Flasher le firmware

            ### Le plus simple : le flasher web MeshCore

            1. Ouvrir [flasher.meshcore.io](https://flasher.meshcore.io) ;
            2. choisir **« Custom Firmware »**, tout en bas de la liste des modèles de cartes ;
            3. sélectionner le fichier correspondant à votre carte ci-dessous, et flasher.

            | Carte | Fichier |
            |---|---|
            | Seeed Wio Tracker L1 Pro | `meshcaching-wio_tracker_l1-${{ github.ref_name }}.zip` |
            | Heltec WiFi LoRa 32 V3 | `meshcaching-heltec_v3-${{ github.ref_name }}-merged.bin` |
            | Heltec WiFi LoRa 32 V4.2 | `meshcaching-heltec_v4_2-${{ github.ref_name }}-merged.bin` |
            | Heltec WiFi LoRa 32 V4.3 | `meshcaching-heltec_v4_3-${{ github.ref_name }}-merged.bin` |
            | Heltec WiFi LoRa 32 V4 R8 | `meshcaching-heltec_v4_r8-${{ github.ref_name }}-merged.bin` |
            | Heltec T096 | `meshcaching-heltec_t096-${{ github.ref_name }}.zip` |
            | LilyGo T-Beam Supreme (SX1262) | `meshcaching-tbeam_supreme-${{ github.ref_name }}-merged.bin` |
            | LilyGo T-Deck / T-Deck Plus | `meshcaching-tdeck-${{ github.ref_name }}-merged.bin` |
            | LilyGo T-Echo | `meshcaching-techo-${{ github.ref_name }}.zip` |

            Sur les cartes ESP32 (Heltec, T-Beam, T-Deck), l'image est complète et efface tout l'appareil (le suffixe `-merged.bin` indique au flasher de l'écrire à l'adresse 0).

            ### Alternatives en ligne de commande

            - **Cartes nRF52 (Wio Tracker L1, T096, T-Echo)** : double appui sur RESET (un disque USB apparaît), puis glisser-déposer le fichier `.uf2` de la carte dessus. Ou en DFU série : `adafruit-nrfutil dfu serial --package <fichier>.zip -p <port> -b 115200 --singlebank --touch 1200`
            - **Cartes ESP32 (Heltec, T-Beam, T-Deck)** : `esptool --chip esp32s3 write_flash 0x0 meshcaching-<carte>-${{ github.ref_name }}-merged.bin`

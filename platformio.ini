; Scanner RSSI de répéteur MeshCore — build multi-cartes.
;
; Compiler une cible : pio run -e wio_tracker_l1 | heltec_v3 | heltec_v4_3 | heltec_v4_r8
; Sans -e, toutes les cibles sont compilées.
;
; L'application (src/) est commune : chaque carte est décrite par un
; fichier src/hal/boards/*.cpp, sélectionné par son drapeau -D BOARD_xxx.

[env]
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_deps =
    jgromes/RadioLib@^7
    olikraus/U8g2@^2.36

; ----------------- Famille nRF52 -----------------

[nrf52_base]
platform = nordicnrf52
board_build.variants_dir = variants

; Seeed Wio Tracker L1 Pro (nRF52840 + SX1262 + OLED SH1106)
; Définition de carte et variante Arduino reprises du firmware MeshCore
; (cf. boards/README.md). Le linker script place l'application après le
; SoftDevice S140 7.3.0 installé par le bootloader UF2 d'usine.
[env:wio_tracker_l1]
extends = nrf52_base
board = seeed-wio-tracker-l1
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${env.build_flags} -D BOARD_WIO_TRACKER_L1

; ----------------- Famille ESP32 -----------------

[esp32_base]
platform = espressif32@6.11.0
monitor_filters = esp32_exception_decoder

; Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262 + OLED SSD1306)
[env:heltec_v3]
extends = esp32_base
board = heltec_wifi_lora_32_V3
build_flags = ${env.build_flags} -D BOARD_HELTEC_V3

; Heltec WiFi LoRa 32 V4, révision 4.3 (ESP32-S3R2 + SX1262 + FEM KCT8103L
; + OLED SSD1306). Définition de carte et pins_arduino.h repris du firmware
; MeshCore (cf. boards/README.md).
; -Wno-cpp : coupe le #warning de RadioLib sur l'USB CDC — le define
; ARDUINO_USB_CDC_ON_BOOT est requis sur cette carte (USB natif, pas de
; pont USB-UART) et l'avertissement ne concerne que le debug RadioLib
; (désactivé) en cas de sommeil (non utilisé).
[env:heltec_v4_3]
extends = esp32_base
board = heltec_v4
board_build.variants_dir = variants
build_flags = ${env.build_flags} -D BOARD_HELTEC_V4_3 -Wno-cpp

; Heltec WiFi LoRa 32 V4 « R8 » (ESP32-S3R8, 8 Mo PSRAM) : même carte que
; la 4.3 (FEM KCT8103L compris) hormis la broche du rail Vext (GPIO40).
[env:heltec_v4_r8]
extends = esp32_base
board = heltec_v4_r8
board_build.variants_dir = variants
build_flags = ${env.build_flags} -D BOARD_HELTEC_V4_R8 -Wno-cpp

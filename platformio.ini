; MeshCore repeater RSSI scanner - multi-board build.
;
; Build one target: pio run -e wio_tracker_l1 | heltec_v3 | heltec_v4_2 | heltec_v4_3
;                 | heltec_v4_r8 | heltec_t096 | tbeam_supreme | tdeck
; Without -e, every target is built.
;
; The application (src/) is shared: each board is described by one
; src/hal/boards/*.cpp file, selected by its -D BOARD_xxx flag.

; RADIOLIB_LOW_LEVEL exposes readRegister/writeRegister, required by the
; RX patch of register 0x8B5 on the Heltec V4 (see src/hal/Radio.cpp).
[env]
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/version.py
build_flags = -Wall -D RADIOLIB_LOW_LEVEL=1
; Exact versions: we rely on a low-level RadioLib API (register 0x8B5
; patch) and releases must be reproducible.
lib_deps =
    jgromes/RadioLib@7.7.1
    olikraus/U8g2@2.36.18

; ----------------- nRF52 family -----------------

[nrf52_base]
platform = nordicnrf52@10.12.0
board_build.variants_dir = variants

; Seeed Wio Tracker L1 Pro (nRF52840 + SX1262 + SH1106 OLED)
; Board definition and Arduino variant taken from the MeshCore firmware
; (see boards/README.md). The linker script places the application after
; the SoftDevice S140 7.3.0 installed by the factory UF2 bootloader.
[env:wio_tracker_l1]
extends = nrf52_base
board = seeed-wio-tracker-l1
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${env.build_flags} -D BOARD_WIO_TRACKER_L1

; Heltec T096 (nRF52840 + SX1262 + KCT8103L FEM + 0.96" ST7735 TFT).
; Board definition, linker script (SoftDevice S140 6.1.1) and variant
; taken from the MeshCore firmware (see boards/README.md).
[env:heltec_t096]
extends = nrf52_base
board = heltec_t096
board_build.ldscript = boards/nrf52840_s140_v6.ld
build_flags = ${env.build_flags} -D BOARD_HELTEC_T096
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    olikraus/U8g2_for_Adafruit_GFX@1.8.0

; LilyGo T-Echo (nRF52840 + SX1262 + 1.54" 200x200 e-ink, SSD1681).
; Board definition and variant taken from the MeshCore firmware (see
; boards/README.md); same SoftDevice S140 6.1.1 layout as the T096.
; GxEPD2 drives the panel; -D TECHO_EINK_MODEL=GxEPD2_150_BN selects the
; DEPG0150BN panel of some batches instead of the GDEH0154D67.
[env:techo]
extends = nrf52_base
board = lilygo_t_echo
board_build.ldscript = boards/nrf52840_s140_v6.ld
build_flags = ${env.build_flags} -D BOARD_TECHO
lib_deps =
    ${env.lib_deps}
    zinggjm/GxEPD2@1.6.9
    olikraus/U8g2_for_Adafruit_GFX@1.8.0

; ----------------- ESP32 family -----------------

[esp32_base]
platform = espressif32@6.11.0
monitor_filters = esp32_exception_decoder

; Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262 + SSD1306 OLED)
[env:heltec_v3]
extends = esp32_base
board = heltec_wifi_lora_32_V3
build_flags = ${env.build_flags} -D BOARD_HELTEC_V3

; Heltec WiFi LoRa 32 V4, revision <= 4.2 (ESP32-S3R2 + SX1262 + GC1109 FEM
; + SSD1306 OLED). Same board definition / pins_arduino.h as the 4.3; the
; FEM control differs (CPS on GPIO46, no software LNA).
[env:heltec_v4_2]
extends = esp32_base
board = heltec_v4
board_build.variants_dir = variants
build_flags = ${env.build_flags} -D BOARD_HELTEC_V4_2 -Wno-cpp

; Heltec WiFi LoRa 32 V4, revision 4.3 (ESP32-S3R2 + SX1262 + KCT8103L FEM
; + SSD1306 OLED). Board definition and pins_arduino.h taken from the
; MeshCore firmware (see boards/README.md).
; -Wno-cpp: silences the RadioLib #warning about USB CDC - the
; ARDUINO_USB_CDC_ON_BOOT define is required on this board (native USB, no
; USB-UART bridge) and the warning only concerns RadioLib debug output
; (disabled) during sleep (not used).
[env:heltec_v4_3]
extends = esp32_base
board = heltec_v4
board_build.variants_dir = variants
build_flags = ${env.build_flags} -D BOARD_HELTEC_V4_3 -Wno-cpp

; Heltec WiFi LoRa 32 V4 "R8" (ESP32-S3R8, 8 MB PSRAM): same board as the
; 4.3 (KCT8103L FEM included) except for the Vext rail pin (GPIO40).
[env:heltec_v4_r8]
extends = esp32_base
board = heltec_v4_r8
board_build.variants_dir = variants
build_flags = ${env.build_flags} -D BOARD_HELTEC_V4_R8 -Wno-cpp

; LilyGo T-Beam Supreme, 868 MHz SX1262 variant (ESP32-S3 + SX1262 +
; SH1106 OLED + AXP2101 PMU). Board definition taken from the MeshCore
; firmware (see boards/README.md); generic esp32s3 Arduino variant.
; XPowersLib drives the PMU, which powers the radio and the display.
[env:tbeam_supreme]
extends = esp32_base
board = lilygo_tbeam_supreme
build_flags = ${env.build_flags} -D BOARD_TBEAM_SUPREME -Wno-cpp
lib_deps =
    ${env.lib_deps}
    lewisxhe/XPowersLib@0.3.3


[env:tdeck]
extends = esp32_base
board = t-deck
build_flags =
  ${env.build_flags}
  -D BOARD_TDECK
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM=1
  -D CORE_DEBUG_LEVEL=1
  -Wno-cpp
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
  olikraus/U8g2_for_Adafruit_GFX@1.8.0
